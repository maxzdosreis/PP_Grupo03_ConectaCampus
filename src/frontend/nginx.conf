# Modo de produção (INF-08). Sem segredos: só roteamento.
# O navegador fala com UMA origem (este nginx): serve a tela e repassa /api/, /admin/ e
# /static/ ao backend. Por isso VITE_API_URL=/api e não há CORS. O IP do cliente vai em
# X-Forwarded-For (sobrescrito, nunca concatenado): o limite de tentativas depende dele.
# Atrás de um proxy TLS, vale o X-Forwarded-Proto dele; senão, o esquema desta conexão.
map $http_x_forwarded_proto $esquema_do_cliente {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $esquema_do_cliente;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
